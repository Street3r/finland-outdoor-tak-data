name: Stale data check

# Opens an issue (which notifies the repository owner by e-mail) when the
# generated data has not been checked for too long, e.g. because the server
# or the publisher is down. Closes the issue again once updates resume.

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:

permissions:
  actions: write   # keep-alive below
  contents: read
  issues: write

env:
  # Weekly run on Monday morning: a missed run opens the issue on Tuesday
  MAX_AGE_DAYS: "8"
  TITLE: "Generated data is out of date"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: data
          sparse-checkout: status.json
          sparse-checkout-cone-mode: false
      - name: Check status.json age
        id: age
        run: |
          if [ ! -f status.json ]; then echo "days=999" >> "$GITHUB_OUTPUT"; echo "stale=1" >> "$GITHUB_OUTPUT"; echo "checked=never" >> "$GITHUB_OUTPUT"; exit 0; fi
          checked=$(python3 -c "import json;print(json.load(open('status.json'))['checked'])")
          blocked=$(python3 -c "import json;b=json.load(open('status.json')).get('publish_blocked');print(f\"{b['at']}: {b['features']} features, {b['published_features']} published\" if b else '')")
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          python3 -c "import json,sys;sys.stdout.write(''.join('- '+w+'\\n' for w in json.load(open('status.json')).get('warnings') or []))" > warnings.md
          age=$(python3 -c "import datetime as d;c=d.datetime.fromisoformat('$checked');a=(d.datetime.now(d.timezone.utc)-c).total_seconds()/86400;print(f'{a:.1f}', int(a > $MAX_AGE_DAYS))")
          days=${age% *}
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "stale=${age#* }" >> "$GITHUB_OUTPUT"
          echo "Last check $checked ($days days ago)"
      - name: Open or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ steps.age.outputs.days }}
          STALE: ${{ steps.age.outputs.stale }}
          CHECKED: ${{ steps.age.outputs.checked }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ "$STALE" = "1" ]; then
            if [ -z "$open" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The data was last checked **$CHECKED** ($DAYS days ago; limit $MAX_AGE_DAYS days).

          Check on the server: \`docker compose ps\`, \`docker compose logs --tail 50 generator\` and \`docker compose logs --tail 50 publisher\`.

          This issue closes automatically when updates resume."
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Data checked $CHECKED again; closing."
          fi
      - name: Open or close the blocked-update issue
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.age.outputs.blocked }}
          BTITLE: "Data update blocked: far fewer features"
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$BTITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$BLOCKED" ]; then
            if [ -z "$open" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$BTITLE" --body "The publisher did not publish the latest build because it has far fewer features than the published data ($BLOCKED). The published data was kept.

          This usually means a source (often OpenStreetMap Overpass) returned incomplete data. Check \`docker compose logs --tail 100 generator\` on the server. If the drop is expected, publish anyway: \`docker compose run --rm publisher publish --raw /data/raw --workdir /data/publish --allow-shrink\`.

          This issue closes automatically after the next successful update."
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Data published again; closing."
          fi
      - name: Open, update or close the quality warnings issue
        env:
          GH_TOKEN: ${{ github.token }}
          WTITLE: "Data quality warnings"
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$WTITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -s warnings.md ]; then
            { echo "The latest build reported these quality warnings (status.json):"; echo; cat warnings.md; echo
              echo "Areas without features got no package; a missing base name means the area's file name, hashtag and English name were guessed (add it to config/area_names.yaml in python-lipas2tak-tool)."
              echo; echo "This issue is updated daily and closes automatically when the warnings are gone."; } > body.md
            if [ -z "$open" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$WTITLE" --body-file body.md
            else
              gh issue edit "$open" --repo "$GITHUB_REPOSITORY" --body-file body.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "No quality warnings in the latest build; closing."
          fi
      # GitHub disables scheduled workflows of a public repository after 60 days
      # without repository activity, and it is not documented whether the weekly
      # pushes to the data branch count. Re-enabling the (still enabled) workflow
      # through the API is the common keep-alive; it does not change anything else.
      - name: Keep this scheduled workflow enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/stale-data.yml/enable"
