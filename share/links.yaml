# Shared links. tools/make_qr.py turns these into QR codes (share/qr/)
# and the pages SHARE.md (English) and SHARE.fi.md (Finnish).
#
#   id:     file name of the QR code
#   lang:   en | fi | all  (which page lists it)
#   group:  heading on the page
#   title:  shown on the page
#   path:   relative to base_url (or `url:` for a full URL)
#   kind:   import -> tak://com.atakmap.app/import?url=... (ATAK opens the file)
#           url    -> plain link (browser, iTAK, WinTAK)
#   note:   optional short text
#
# Per-area QR codes are on the generated share pages (share/<lang>/ on GitHub Pages).
base_url: https://street3r.github.io/finland-outdoor-tak-data/

links:
  - id: share_en
    lang: en
    group: Start here
    title: Share page with all QR codes
    path: share/en/index.html
    kind: url
    note: National parks and regions, one QR code per area.
  - id: share_fi
    lang: fi
    group: Aloita tästä
    title: Jakosivu, kaikki QR-koodit
    path: share/fi/index.html
    kind: url
    note: Kansallispuistot ja maakunnat, QR-koodi jokaiselle alueelle.

  - id: iconset
    lang: en
    group: Start here
    title: Icon set (install once)
    path: iconset/lipas2tak_iconset.zip
    kind: import
  - id: iconset
    lang: fi
    group: Aloita tästä
    title: Kuvakesarja (asennetaan kerran)
    path: iconset/lipas2tak_iconset.zip
    kind: import

  - id: all_en
    lang: en
    group: All areas
    title: All areas as auto-refreshing layers (KML network link)
    path: links/all_en.kml
    kind: url
    note: Copy the URL, then in ATAK - Import → KML Link, paste it, Auto Refresh 86400 s. (Opening it via QR import only makes a one-off copy.)
  - id: all_fi
    lang: fi
    group: Kaikki alueet
    title: Kaikki alueet päivittyvinä tasoina (KML-verkkolinkki)
    path: links/all_fi.kml
    kind: url
    note: Kopioi osoite ja lisää ATAKissa - Import → KML Link, liitä osoite, Auto Refresh 86400 s. (QR-tuonti tekisi vain kertakopion.)
